name: Verify

on:
  pull_request:
  workflow_call:
  schedule:
    - cron: '43 12 * * 1'

permissions:
  contents: read

concurrency:
  group: media-processor-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Tests, lint, and dependency audit
        run: |
          npm ci
          npm test -- --runInBand
          npm run lint
          npm audit --audit-level=moderate
          shellcheck scripts/*.sh

      - name: Build, scan, and exercise the exact release images
        run: |
          set -euo pipefail
          docker build --pull --target test -t media-processor:test .
          docker build --pull -t media-processor:verify .
          scripts/verify-images.sh media-processor:test media-processor:verify
