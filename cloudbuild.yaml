steps:
  - id: build-release-test-image
    name: 'gcr.io/cloud-builders/docker@sha256:617f98016081e2978c0b44184d7b09446027b909f1078b8fdc23efc4c74c5f20'
    args:
      - build
      - --pull
      - --target
      - test
      - --tag
      - 'media-processor:test-$BUILD_ID'
      - .

  - id: build-production-image
    name: 'gcr.io/cloud-builders/docker@sha256:617f98016081e2978c0b44184d7b09446027b909f1078b8fdc23efc4c74c5f20'
    args:
      - build
      - --target
      - runtime
      - --tag
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/media-processor-repo/media-processor:$COMMIT_SHA'
      - .

  - id: execute-tests-and-runtime-contract
    name: 'gcr.io/cloud-builders/docker@sha256:617f98016081e2978c0b44184d7b09446027b909f1078b8fdc23efc4c74c5f20'
    entrypoint: sh
    args:
      - scripts/verify-images.sh
      - 'media-processor:test-$BUILD_ID'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/media-processor-repo/media-processor:$COMMIT_SHA'

  - id: publish-reviewed-image
    name: 'gcr.io/cloud-builders/docker@sha256:617f98016081e2978c0b44184d7b09446027b909f1078b8fdc23efc4c74c5f20'
    args:
      - push
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/media-processor-repo/media-processor:$COMMIT_SHA'

  - id: transactional-private-rollout
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:570dc7ce2876a2810dbf80f1d2520c1654aa218a7f1347715243a79c98d166ae'
    entrypoint: bash
    args:
      - scripts/release-cloud-run.sh
      - '$PROJECT_ID'
      - '$COMMIT_SHA'
      - '$BUILD_ID'
      - '$_PLATFORM_OIDC_READY'
      - '$_PLATFORM_OIDC_PROOF'

# Record the released image in the Cloud Build result/provenance. It has
# already been pushed for the digest-based candidate deploy; the final push is
# idempotent and binds the successful build record to those exact bytes.
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/media-processor-repo/media-processor:$COMMIT_SHA'

substitutions:
  # Fail closed until a reviewed platform-api OIDC caller is deployed and a
  # real thumbnail request has been captured. The approval-gated release must
  # override both values. The proof is exact: platform-api@<40-char serving
  # Git SHA>; release-cloud-run.sh matches it against production /versionz
  # before the first gcloud lookup, then leaves it in the build record.
  _PLATFORM_OIDC_READY: 'false'
  _PLATFORM_OIDC_PROOF: 'UNSET'

serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/media-processor-release@$PROJECT_ID.iam.gserviceaccount.com'

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY
